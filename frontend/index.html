<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂考勤系统 — 考勤签到</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <span class="logo">课堂考勤</span>
    <a href="index.html" class="active">考勤签到</a>
    <a href="group.html">合照识别</a>
    <a href="data.html">数据查询</a>
</nav>

<!-- 全局注册入口（固定浮层） -->
<a class="btn-fixed-register" href="#" onclick="openRegisterModal();return false;">注册人脸</a>

<main class="container" style="max-width:1100px;">
    <div class="attendance-layout">
        <div class="attendance-left">
            <div class="card" style="margin-bottom:0;">
                <h2>考勤签到</h2>
                <div class="camera-container" id="cameraContainer">
                    <video id="video" autoplay playsinline></video>
                    <div class="camera-overlay overlay-scanning" id="cameraOverlay">点击拍照签到</div>
                </div>
                <div style="margin-top:16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                    <button class="btn btn-primary" id="btnCapture" onclick="manualCapture()">拍照签到</button>
                    <span style="font-size:13px; color:var(--text-muted);" id="cameraStatus">摄像头未启动</span>
                </div>
            </div>
        </div>

        <div class="attendance-right">
            <div class="card" style="margin-bottom:0;">
                <h2>签到结果</h2>
                <div id="resultContainer">
                    <p style="color:var(--text-muted);font-size:13px;">等待签到...</p>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- 注册弹窗 -->
<div class="modal-overlay" id="registerModal" onclick="closeModalOutside(event)">
    <div class="modal modal-wide" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3>人脸注册</h3>
            <button class="modal-close" onclick="closeRegisterModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-row">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="regName" placeholder="如：张三">
                </div>
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" id="regStudentId" placeholder="如：20240001">
                </div>
            </div>
            <div class="camera-container" style="margin-bottom:12px;">
                <video id="regVideo" autoplay playsinline></video>
                <div class="camera-overlay overlay-scanning">请面对摄像头</div>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <button class="btn btn-primary" id="btnRegister" onclick="registerFace()">拍照注册</button>
                <span style="font-size:13px; color:var(--text-muted);">或</span>
                <label class="btn btn-outline" style="cursor:pointer;">
                    上传照片注册
                    <input type="file" id="regFileInput" accept="image/*" style="display:none;" onchange="registerFromFile(this.files[0])">
                </label>
            </div>
            <div id="regResult" style="margin-top:12px;font-size:13px;"></div>
        </div>
    </div>
</div>

<script src="js/register-modal.js?v=3"></script>
<script src="js/attendance.js?v=5"></script>
</body>
</html>
