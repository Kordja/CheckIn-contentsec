<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂考勤系统 — 合照识别</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<nav>
    <span class="logo">课堂考勤</span>
    <a href="index.html">考勤签到</a>
    <a href="group.html" class="active">合照识别</a>
    <a href="data.html">数据查询</a>
</nav>

<a class="btn-fixed-register" href="#" onclick="openRegisterModal();return false;">注册人脸</a>

<main class="container">
    <!-- 上传识别 -->
    <div class="card">
        <h2>上传合照</h2>
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📷</div>
            <p>点击选择合照 或 拖拽到此处</p>
            <p style="font-size:12px; color:var(--text-muted);">支持 JPG / PNG / BMP / WebP</p>
            <div style="position:relative; display:inline-block; max-width:100%;">
                <img id="preview" style="display:none;">
                <button class="preview-close" id="previewClose" style="display:none;" onclick="clearPreview(event)" title="移除图片">&times;</button>
            </div>
        </div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/bmp,image/webp" style="display:none" onchange="handleFile(this.files[0])">
        <div class="form-row" style="margin-top:12px;">
            <div class="form-group" style="flex:1;">
                <label>活动名称</label>
                <input type="text" id="activityName" placeholder="默认当天日期">
            </div>
        </div>
        <div style="margin-top:12px;">
            <button class="btn btn-primary" id="btnAnalyze" disabled onclick="analyzeGroup()">开始识别</button>
            <span style="font-size:13px; color:var(--text-muted); margin-left:12px;" id="statusText"></span>
        </div>
    </div>

    <!-- 识别结果 -->
    <div class="card" id="resultCard" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleResult()">
            <h2>识别结果</h2>
            <span id="resultToggle" style="font-size:13px; color:var(--text-muted);">收起 ▴</span>
        </div>
        <div id="resultPanel">
            <div class="stats-grid" id="statsGrid"></div>
            <table>
                <thead><tr>
                    <th>序号</th><th>学号</th><th>姓名</th><th>情绪</th><th>人脸位置</th>
                </tr></thead>
                <tbody id="resultBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 识别记录（可折叠） -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleHistory()">
            <h2>识别记录</h2>
            <span id="historyToggle" style="font-size:13px; color:var(--text-muted);">展开 ▾</span>
        </div>
        <div id="historyPanel" style="display:none; margin-top:16px;">
            <!-- 筛选 -->
            <div class="form-row">
                <div class="form-group">
                    <label>起始日期</label>
                    <input type="date" id="filterDateStart">
                </div>
                <div class="form-group">
                    <label>截止日期</label>
                    <input type="date" id="filterDateEnd">
                </div>
                <div class="form-group">
                    <label>活动名称</label>
                    <input type="text" id="filterName" placeholder="模糊搜索">
                </div>
            </div>
            <div style="display:flex; gap:12px; margin-bottom:16px;">
                <button class="btn btn-primary" onclick="queryHistory()">查询</button>
                <button class="btn btn-outline" onclick="exportMerged()">合并导出 Excel</button>
                <button class="btn btn-outline" onclick="exportMergedCSV()">合并导出 CSV</button>
            </div>

            <!-- 左右分栏 -->
            <div class="history-split">
                <!-- 左侧：活动列表 -->
                <div style="display:flex; flex-direction:column; height:440px;">
                    <div style="flex:1; overflow-y:auto; min-height:0;">
                        <table>
                            <thead><tr>
                                <th style="width:32px;"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()" title="全选/取消"></th>
                                <th>活动名称</th><th style="width:90px;">时间</th><th style="width:44px;">人数</th><th>操作</th>
                            </tr></thead>
                            <tbody id="historyBody">
                                <tr><td colspan="5" style="text-align:center; color:var(--text-muted);">点击"查询"加载记录</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="historyPager" style="padding:10px 0; border-top:1px solid var(--border); flex-shrink:0;"></div>
                </div>

                <!-- 右侧：频次统计 -->
                <div class="card" style="margin-bottom:0;">
                    <h2>参与频次统计</h2>
                    <div id="freqStats" style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">勾选活动后自动统计</div>
                    <div class="chart-wrap"><canvas id="freqChart"></canvas></div>
                    <div id="freqTable" style="margin-top:12px; max-height:260px; overflow-y:auto;"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- 注册弹窗 -->
<div class="modal-overlay" id="registerModal" onclick="closeModalOutside(event)">
    <div class="modal modal-wide" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3>人脸注册</h3>
            <button class="modal-close" onclick="closeRegisterModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-row">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="regName" placeholder="如：张三">
                </div>
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" id="regStudentId" placeholder="如：20240001">
                </div>
            </div>
            <div class="camera-container" style="margin-bottom:12px;">
                <video id="regVideo" autoplay playsinline></video>
                <div class="camera-overlay overlay-scanning">请面对摄像头</div>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <button class="btn btn-primary" id="btnRegister" onclick="registerFace()">拍照注册</button>
                <span style="font-size:13px; color:var(--text-muted);">或</span>
                <label class="btn btn-outline" style="cursor:pointer;">
                    上传照片注册
                    <input type="file" id="regFileInput" accept="image/*" style="display:none;" onchange="registerFromFile(this.files[0])">
                </label>
            </div>
            <div id="regResult" style="margin-top:12px;font-size:13px;"></div>
        </div>
    </div>
</div>

<!-- 参与人员弹窗 -->
<div class="modal-overlay" id="participantsModal" onclick="closeParticipantsModalOutside(event)">
    <div class="modal" style="width:560px;" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="participantsTitle">参与人员</h3>
            <button class="modal-close" onclick="closeParticipantsModal()">&times;</button>
        </div>
        <div class="modal-body" id="participantsBody" style="max-height:60vh; overflow-y:auto;">
            <p style="color:var(--text-muted);">加载中...</p>
        </div>
    </div>
</div>

<script src="js/register-modal.js?v=2"></script>
<script src="js/group.js?v=4"></script>
</body>
</html>
