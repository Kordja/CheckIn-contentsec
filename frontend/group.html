<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂考勤系统 — 合照识别</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <span class="logo">课堂考勤</span>
    <a href="index.html">考勤签到</a>
    <a href="group.html" class="active">合照识别</a>
    <a href="data.html">数据查询</a>
</nav>

<a class="btn-fixed-register" href="#" onclick="openRegisterModal();return false;">注册人脸</a>

<main class="container">
    <!-- 上传区域 -->
    <div class="card">
        <h2>上传合照</h2>
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📷</div>
            <p>点击选择合照 或 拖拽到此处</p>
            <p style="font-size:12px; color:var(--text-muted);">支持 JPG / PNG / BMP / WebP</p>
            <img id="preview" style="display:none;">
        </div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/bmp,image/webp" style="display:none" onchange="handleFile(this.files[0])">
        <div style="margin-top:12px;">
            <button class="btn btn-primary" id="btnAnalyze" disabled onclick="analyzeGroup()">开始识别</button>
            <span style="font-size:13px; color:var(--text-muted); margin-left:12px;" id="statusText"></span>
        </div>
    </div>

    <!-- 结果 -->
    <div class="card" id="resultCard" style="display:none;">
        <h2>识别结果</h2>
        <div class="stats-grid" id="statsGrid"></div>
        <table>
            <thead><tr>
                <th>序号</th><th>学号</th><th>姓名</th><th>人脸位置</th>
            </tr></thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</main>

<!-- 注册弹窗 -->
<div class="modal-overlay" id="registerModal" onclick="closeModalOutside(event)">
    <div class="modal modal-wide" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3>人脸注册</h3>
            <button class="modal-close" onclick="closeRegisterModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-row">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="regName" placeholder="如：张三">
                </div>
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" id="regStudentId" placeholder="如：20240001">
                </div>
            </div>
            <div class="camera-container" style="margin-bottom:12px;">
                <video id="regVideo" autoplay playsinline></video>
                <div class="camera-overlay overlay-scanning">请面对摄像头</div>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <button class="btn btn-primary" id="btnRegister" onclick="registerFace()">拍照注册</button>
                <span style="font-size:13px; color:var(--text-muted);">或</span>
                <label class="btn btn-outline" style="cursor:pointer;">
                    上传照片注册
                    <input type="file" id="regFileInput" accept="image/*" style="display:none;" onchange="registerFromFile(this.files[0])">
                </label>
            </div>
            <div id="regResult" style="margin-top:12px;font-size:13px;"></div>
        </div>
    </div>
</div>

<script src="js/register-modal.js"></script>
<script src="js/group.js"></script>
</body>
</html>
